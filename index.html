<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confera Premium Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>

    <!-- GradeX-style fixed header -->
    <header class="app-header reveal">
      <div class="app-header-left">
        <span class="brand-mark">Confera</span>
      </div>
      <div class="app-header-center">
        <span class="header-tagline">a gradex product</span>
      </div>
      <div class="app-header-right">
        <div class="header-by">
          <span>By</span>
          <span>Stark</span>
        </div>
        <a href="https://github.com/StarkAg" target="_blank" rel="noopener noreferrer" class="header-icon-btn" title="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>
        </a>
        <a href="https://in.linkedin.com/in/harshxagarwal" target="_blank" rel="noopener noreferrer" class="header-icon-btn" title="LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
            <rect x="2" y="9" width="4" height="12"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
        </a>
      </div>
    </header>

    <main class="page">
      <section class="hero panel reveal">
        <canvas id="sceneCanvas" aria-hidden="true"></canvas>
        <div class="hero-content">
          <p class="eyebrow">IEEE India · 2026</p>
          <h1>Confera</h1>
          <p>
            Your smart lens into 250 IEEE India conferences — track CFP deadlines, filter by domain, and find your next publication opportunity.
          </p>
        </div>
      </section>

      <section class="stats reveal" id="statsBar"></section>

      <section class="controls panel reveal">
        <div class="control-grid">
          <label>
            <span>Search Conference</span>
            <input id="searchInput" type="text" placeholder="Search by name, acronym, location, field..." />
          </label>

          <label>
            <span>Call for Papers (CFP) Status</span>
            <select id="cfpFilter">
              <option value="all">All</option>
              <option value="open">Open</option>
              <option value="closed">Closed</option>
              <option value="missing">Missing</option>
            </select>
          </label>

          <label>
            <span>Conference Year</span>
            <select id="yearFilter">
              <option value="all">All</option>
            </select>
          </label>

          <button id="clearFilters" class="ghost-btn" type="button">Clear Filters</button>
        </div>

        <div class="field-filter-wrap">
          <button class="fields-heading" id="fieldsToggle" type="button" aria-expanded="false">
            <h2>Field of Interest Filters</h2>
            <span class="fields-toggle-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
          <div id="fieldChips" class="chips chips-collapsed"></div>
        </div>
      </section>

      <section class="results reveal">
        <div class="results-head">
          <h2 id="resultTitle">Conference Results</h2>
          <p id="resultCount">0 shown</p>
        </div>
        <div id="conferenceGrid" class="conference-grid"></div>
      </section>
    </main>

    <template id="conferenceCardTemplate">
      <article class="conference-card">
        <div class="card-top">
          <h3 class="conf-title"></h3>
        </div>
        <div class="card-badges">
          <span class="status-pill"></span>
          <span class="deadline"></span>
        </div>
        <div class="card-info-row">
          <span class="card-info-item card-dates"></span>
          <span class="card-info-item card-meta"></span>
        </div>
        <p class="card-sponsors"></p>
        <div class="card-bottom">
          <div class="field-tags"></div>
          <a class="card-ieee-link" target="_blank" rel="noopener noreferrer">IEEE Page ↗</a>
        </div>
      </article>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
